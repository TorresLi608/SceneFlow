components:
  schemas:
    CreateCharacterRequest:
      properties:
        name:
          type: string
          maxLength: 80
          minLength: 1
          title: Name
        aliases:
          type: string
          maxLength: 400
          title: Aliases
          default: ''
        description:
          type: string
          maxLength: 4000
          title: Description
          default: ''
        appearancePrompt:
          type: string
          maxLength: 4000
          title: Appearanceprompt
          default: ''
        voiceProvider:
          type: string
          maxLength: 40
          title: Voiceprovider
          default: ''
        voiceModel:
          type: string
          maxLength: 160
          title: Voicemodel
          default: ''
        orderNum:
          type: integer
          maximum: 9999.0
          minimum: 0.0
          title: Ordernum
          default: 0
      additionalProperties: false
      type: object
      required:
      - name
      title: CreateCharacterRequest
    CreateCharacterVariantRequest:
      properties:
        name:
          type: string
          maxLength: 80
          minLength: 1
          title: Name
        appearancePrompt:
          type: string
          maxLength: 4000
          title: Appearanceprompt
          default: ''
        voiceModel:
          type: string
          maxLength: 160
          title: Voicemodel
          default: ''
        fromEpisode:
          type: integer
          minimum: 1.0
          title: Fromepisode
          default: 1
        toEpisode:
          anyOf:
          - type: integer
            minimum: 1.0
          - type: 'null'
          title: Toepisode
      additionalProperties: false
      type: object
      required:
      - name
      title: CreateCharacterVariantRequest
      description: 'A deliberate change of look or voice over a range of episodes.


        Every override is optional and an empty one means "unchanged", so a variant that only

        swaps the voice keeps the established look.'
    CreateEpisodeRequest:
      properties:
        title:
          type: string
          maxLength: 80
          title: Title
          default: ''
        synopsis:
          type: string
          maxLength: 4000
          title: Synopsis
          default: ''
        sourceText:
          type: string
          maxLength: 200000
          title: Sourcetext
          default: ''
      additionalProperties: false
      type: object
      title: CreateEpisodeRequest
      description: 'Everything optional: the common case is "add the next episode" with nothing else.'
    CreateProjectRequest:
      properties:
        title:
          type: string
          maxLength: 80
          title: Title
          default: ''
        originalScript:
          type: string
          maxLength: 200000
          title: Originalscript
          default: ''
        productionSettings:
          $ref: '#/components/schemas/ProductionSettingsRequest'
      additionalProperties: false
      type: object
      title: CreateProjectRequest
    GenerateProjectRequest:
      properties:
        model:
          anyOf:
          - type: string
            maxLength: 160
          - type: 'null'
          title: Model
        episodeId:
          anyOf:
          - type: string
            maxLength: 64
          - type: 'null'
          title: Episodeid
      additionalProperties: false
      type: object
      title: GenerateProjectRequest
    GenerateVideoRequest:
      properties:
        model:
          anyOf:
          - type: string
            maxLength: 160
          - type: 'null'
          title: Model
      additionalProperties: false
      type: object
      title: GenerateVideoRequest
    HTTPValidationError:
      properties:
        detail:
          items:
            $ref: '#/components/schemas/ValidationError'
          type: array
          title: Detail
      type: object
      title: HTTPValidationError
    OptimizeProjectRequest:
      properties:
        script:
          anyOf:
          - type: string
            maxLength: 200000
          - type: 'null'
          title: Script
        model:
          anyOf:
          - type: string
            maxLength: 160
          - type: 'null'
          title: Model
      additionalProperties: false
      type: object
      title: OptimizeProjectRequest
    ParseProjectRequest:
      properties:
        script:
          type: string
          maxLength: 200000
          minLength: 1
          title: Script
        model:
          anyOf:
          - type: string
            maxLength: 160
          - type: 'null'
          title: Model
        episodeId:
          anyOf:
          - type: string
            maxLength: 64
          - type: 'null'
          title: Episodeid
        replaceAll:
          type: boolean
          title: Replaceall
          default: false
      additionalProperties: false
      type: object
      required:
      - script
      title: ParseProjectRequest
    ProductionSettingsRequest:
      properties:
        mode:
          anyOf:
          - type: string
            enum:
            - comic
            - drama
          - type: 'null'
          title: Mode
        aspectRatio:
          anyOf:
          - type: string
            enum:
            - '9:16'
            - '16:9'
            - '1:1'
          - type: 'null'
          title: Aspectratio
        width:
          anyOf:
          - type: integer
            maximum: 4096.0
            minimum: 256.0
          - type: 'null'
          title: Width
        height:
          anyOf:
          - type: integer
            maximum: 4096.0
            minimum: 256.0
          - type: 'null'
          title: Height
        fps:
          anyOf:
          - type: integer
            enum:
            - 24
            - 30
          - type: 'null'
          title: Fps
        targetDurationMs:
          anyOf:
          - type: integer
            maximum: 600000.0
            minimum: 10000.0
          - type: 'null'
          title: Targetdurationms
        language:
          anyOf:
          - type: string
            maxLength: 20
            minLength: 1
          - type: 'null'
          title: Language
        stylePrompt:
          anyOf:
          - type: string
            maxLength: 4000
          - type: 'null'
          title: Styleprompt
        negativePrompt:
          anyOf:
          - type: string
            maxLength: 4000
          - type: 'null'
          title: Negativeprompt
        currentStage:
          anyOf:
          - type: string
            enum:
            - script
            - bible
            - storyboard
            - audio
            - timeline
            - export
          - type: 'null'
          title: Currentstage
      additionalProperties: false
      type: object
      title: ProductionSettingsRequest
      description: 'Every field optional so a PATCH can carry just the one the user changed.


        Range checks live here for the OpenAPI schema; `project_service.production_settings`

        stays the single place that resolves defaults and cross-field consistency.'
    ReorderScenesRequest:
      properties:
        sceneIds:
          items:
            type: string
          type: array
          minItems: 1
          title: Sceneids
        episodeId:
          anyOf:
          - type: string
            maxLength: 64
          - type: 'null'
          title: Episodeid
      additionalProperties: false
      type: object
      required:
      - sceneIds
      title: ReorderScenesRequest
    SetSceneCastRequest:
      properties:
        characterIds:
          items:
            type: string
          type: array
          maxItems: 32
          title: Characterids
      additionalProperties: false
      type: object
      title: SetSceneCastRequest
      description: The full cast of a shot; sending an empty list clears it.
    UpdateCharacterRequest:
