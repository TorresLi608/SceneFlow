services:
  backend:
    build:
      context: ./backend
    env_file:
      - path: ./backend/.env
        required: false
    environment:
      PORT: "8080"
      DATABASE_URL: ${DATABASE_URL:-sqlite:////app/data/app.db}
      SCENEFLOW_PRIVATE_GENERATED_DIR: /app/data/private_generated
    ports:
      - "8080:8080"
    volumes:
      - ${SCENEFLOW_DATA_DIR:-./data}:/app/data
    restart: unless-stopped

  frontend:
    build:
      context: ./frontend
      args:
        BACKEND_API_BASE_URL: http://backend:8080
    environment:
      BACKEND_API_BASE_URL: http://backend:8080
      NEXT_PUBLIC_BFF_BASE_URL: ""
      NEXT_PUBLIC_WS_BASE_URL: ws://127.0.0.1:8080
      NEXT_PUBLIC_API_BASE_URL: http://127.0.0.1:8080
    depends_on:
      backend:
        condition: service_healthy
    ports:
      - "4000:4000"
    restart: unless-stopped
