components:
  schemas:
    BreakdownEpisodeRequest:
      properties:
        target:
          type: string
          enum:
          - shots
          - video
          - both
          title: Target
          default: both
        script:
          anyOf:
          - type: string
            maxLength: 200000
          - type: 'null'
          title: Script
        references:
          $ref: '#/components/schemas/BreakdownReferencesRequest'
        replaceAll:
          type: boolean
          title: Replaceall
          default: false
        model:
          anyOf:
          - type: string
            maxLength: 160
          - type: 'null'
          title: Model
      additionalProperties: false
      type: object
      title: BreakdownEpisodeRequest
      description: 'Split a script into shots, motion directions, or both.


        `target` exists because the two halves have different lifetimes: re-deriving the motion

        for shots whose frames are already rendered must not throw those frames away, so

        `video` updates the existing rows in place instead of replacing them.'
    BreakdownReferencesRequest:
      properties:
        characterIds:
          items:
            type: string
          type: array
          maxItems: 64
          title: Characterids
        propIds:
          items:
            type: string
          type: array
          maxItems: 64
          title: Propids
        voiceProfileIds:
          items:
            type: string
          type: array
          maxItems: 64
          title: Voiceprofileids
        useCastSheet:
          type: boolean
          title: Usecastsheet
          default: false
        usePropSheet:
          type: boolean
          title: Usepropsheet
          default: false
        useVoiceSheet:
          type: boolean
          title: Usevoicesheet
          default: false
      additionalProperties: false
      type: object
      title: BreakdownReferencesRequest
      description: 'What the breakdown may look at when it splits the script.


        Selecting nothing is a valid, meaningful choice: it tells the model to decide

        everything from the script alone. Selecting a character with a turnaround sheet is what

        turns "a woman in a red coat" into "参照《林小满》三面图" in the generated prompt.'
    CreateCharacterRequest:
      properties:
        name:
          type: string
          maxLength: 80
          minLength: 1
          title: Name
        aliases:
          type: string
          maxLength: 400
          title: Aliases
          default: ''
        description:
          type: string
          maxLength: 4000
          title: Description
          default: ''
        appearancePrompt:
          type: string
          maxLength: 4000
          title: Appearanceprompt
          default: ''
        voiceProvider:
          type: string
          maxLength: 40
          title: Voiceprovider
          default: ''
        voiceModel:
          type: string
          maxLength: 160
          title: Voicemodel
          default: ''
        orderNum:
          type: integer
          maximum: 9999.0
          minimum: 0.0
          title: Ordernum
          default: 0
      additionalProperties: false
      type: object
      required:
      - name
      title: CreateCharacterRequest
    CreateCharacterStateRequest:
      properties:
        name:
          type: string
          maxLength: 80
          minLength: 1
          title: Name
        description:
          type: string
          maxLength: 4000
          title: Description
          default: ''
        appearancePrompt:
          type: string
          maxLength: 4000
          title: Appearanceprompt
          default: ''
        finalPrompt:
          type: string
          maxLength: 4000
          title: Finalprompt
          default: ''
        voiceModel:
          type: string
          maxLength: 160
          title: Voicemodel
          default: ''
        orderNum:
          type: integer
          maximum: 9999.0
          minimum: 0.0
          title: Ordernum
          default: 0
        fromEpisode:
          anyOf:
          - type: integer
            minimum: 1.0
          - type: 'null'
          title: Fromepisode
        toEpisode:
          anyOf:
          - type: integer
            minimum: 1.0
          - type: 'null'
          title: Toepisode
      additionalProperties: false
      type: object
      required:
      - name
      title: CreateCharacterStateRequest
      description: 'One look a character can appear in: an age, an outfit, a transformation.


        Every override is optional and an empty one means "unchanged", so a state that only

        swaps the voice keeps the established look. `fromEpisode` is what turns a parallel look

        into a timeline change; leaving it unset keeps the state always available.'
    CreateEpisodeRequest:
      properties:
        title:
          type: string
          maxLength: 80
          minLength: 1
          title: Title
        synopsis:
          type: string
          maxLength: 4000
          title: Synopsis
          default: ''
        sourceText:
          type: string
          maxLength: 200000
          title: Sourcetext
          default: ''
      additionalProperties: false
      type: object
      required:
      - title
      title: CreateEpisodeRequest
      description: 'The title is required: an episode list of "第 1 集 / 第 2 集" tells the user nothing.'
    CreateExportRequest:
      properties:
        sceneIds:
          items:
            type: string
          type: array
          maxItems: 60
          minItems: 1
          title: Sceneids
        rangeLabel:
          type: string
          maxLength: 120
          title: Rangelabel
          default: ''
      additionalProperties: false
      type: object
      required:
      - sceneIds
      title: CreateExportRequest
      description: 'Merge chosen shots into one file, in the order given.


        Ordered by the request rather than by shot number: the video section exists to assemble

        a cut, which need not follow the storyboard.'
    CreateProjectRequest:
      properties:
        title:
          type: string
          maxLength: 80
          title: Title
          default: ''
        description:
          type: string
          maxLength: 4000
          title: Description
          default: ''
        coverPrompt:
          type: string
          maxLength: 4000
          title: Coverprompt
          default: ''
        originalScript:
          type: string
          maxLength: 200000
          title: Originalscript
          default: ''
        productionSettings:
          $ref: '#/components/schemas/ProductionSettingsRequest'
      additionalProperties: false
      type: object
      title: CreateProjectRequest
    CreatePropRequest:
      properties:
        name:
          type: string
          maxLength: 80
          minLength: 1
          title: Name
        description:
          type: string
          maxLength: 4000
          title: Description
          default: ''
        ownerCharacterId:
          type: string
          maxLength: 64
          title: Ownercharacterid
          default: ''
        finalPrompt:
          type: string
          maxLength: 4000
          title: Finalprompt
          default: ''
        orderNum:
          type: integer
          maximum: 9999.0
          minimum: 0.0
          title: Ordernum
          default: 0
      additionalProperties: false
      type: object
      required:
      - name
      title: CreatePropRequest
    CreateSceneRequest:
      properties:
        narration:
          anyOf:
          - type: string
            maxLength: 4000
          - type: 'null'
          title: Narration
        dialogue:
          anyOf:
          - type: string
            maxLength: 4000
          - type: 'null'
          title: Dialogue
        speakerCharacterId:
          anyOf:
          - type: string
            maxLength: 64
          - type: 'null'
          title: Speakercharacterid
        visualPrompt:
          anyOf:
          - type: string
            maxLength: 4000
          - type: 'null'
          title: Visualprompt
        shotType:
          anyOf:
          - type: string
            maxLength: 80
          - type: 'null'
          title: Shottype
        cameraMove:
          anyOf:
          - type: string
            maxLength: 80
          - type: 'null'
          title: Cameramove
        transition:
          anyOf:
          - type: string
            maxLength: 80
          - type: 'null'
          title: Transition
        videoPrompt:
          anyOf:
          - type: string
            maxLength: 4000
          - type: 'null'
          title: Videoprompt
        durationMs:
          anyOf:
          - type: integer
            maximum: 600000.0
            minimum: 0.0
          - type: 'null'
          title: Durationms
        subtitleText:
          anyOf:
          - type: string
            maxLength: 4000
          - type: 'null'
          title: Subtitletext
        isLocked:
          anyOf:
          - type: boolean
          - type: 'null'
          title: Islocked
        episodeId:
          anyOf:
          - type: string
            maxLength: 64
          - type: 'null'
          title: Episodeid
      additionalProperties: false
      type: object
      title: CreateSceneRequest
    CreateVoiceProfileRequest:
      properties:
        name:
          type: string
          maxLength: 80
          minLength: 1
          title: Name
        note:
          type: string
          maxLength: 4000
          title: Note
          default: ''
        voiceProvider:
          type: string
          maxLength: 40
          title: Voiceprovider
          default: ''
        voiceModel:
          type: string
          maxLength: 160
          title: Voicemodel
          default: ''
        sampleText:
          type: string
          maxLength: 1000
          title: Sampletext
          default: ''
        orderNum:
          type: integer
          maximum: 9999.0
          minimum: 0.0
          title: Ordernum
          default: 0
      additionalProperties: false
      type: object
      required:
      - name
      title: CreateVoiceProfileRequest
      description: One voice in the show. Provider and model only — credentials stay on the account.
    DesignVoiceProfileRequest:
      properties:
        name:
          type: string
          maxLength: 80
          minLength: 1
          title: Name
        voicePrompt:
          type: string
          maxLength: 1000
          minLength: 1
          title: Voiceprompt
        previewText:
          type: string
          maxLength: 1000
          minLength: 1
          title: Previewtext
        note:
          type: string
          maxLength: 4000
          title: Note
          default: ''
        sampleText:
          type: string
          maxLength: 1000
          title: Sampletext
          default: ''
      additionalProperties: false
      type: object
      required:
      - name
      - voicePrompt
      - previewText
      title: DesignVoiceProfileRequest
      description: 'Design a new timbre and bind it to this series in one step.


        The provider and model come from the project''s audio configuration rather than the

        request: they are an account credential detail, and typing them by hand was how the

        old form let a user create a profile no synthesiser could actually voice.'
    DraftPromptRequest:
      properties:
        name:
          type: string
          maxLength: 80
          title: Name
          default: ''
        description:
          type: string
          maxLength: 4000
          title: Description
          default: ''
        preset:
          type: string
          maxLength: 40
          title: Preset
          default: ''
        model:
          anyOf:
          - type: string
            maxLength: 160
          - type: 'null'
          title: Model
      additionalProperties: false
      type: object
      title: DraftPromptRequest
      description: 'Draft an image prompt for review.


        The fields are taken from the request rather than the stored row so the dialog can draft

        against edits the user has not saved yet. The instruction template is the built-in one

        in `prompt_service` and is not overridable — a second editable prompt field next to the

        one that actually draws only ever confused people about which was which.'
    GenerateCoverRequest:
      properties:
        prompt:
          type: string
          maxLength: 4000
          title: Prompt
          default: ''
        title:
          type: string
          maxLength: 80
          title: Title
          default: ''
        stylePrompt:
          type: string
          maxLength: 4000
          title: Styleprompt
          default: ''
      additionalProperties: false
      type: object
      title: GenerateCoverRequest
      description: 'Draw a cover from a prompt the caller is holding, not from a stored project.


        Project-less on purpose: the create dialog needs this before a project row exists, and

        an edit dialog holds unsaved edits the stored row would not reflect. Nothing is written

        — the caller previews the result and applies it with `PUT /{id}/cover`.


        `prompt` is the subject; title and style are context the model may lean on. It used to

        be the other way round, and a cover drawn from the synopsis illustrated the plot rather

        than being a poster.'
    GenerateProjectRequest:
      properties:
        model:
          anyOf:
          - type: string
            maxLength: 160
          - type: 'null'
          title: Model
        episodeId:
          anyOf:
          - type: string
            maxLength: 64
          - type: 'null'
          title: Episodeid
        sceneIds:
          anyOf:
          - items:
              type: string
            type: array
            maxItems: 100
            minItems: 1
          - type: 'null'
          title: Sceneids
      additionalProperties: false
      type: object
      title: GenerateProjectRequest
    GenerateReferenceImageRequest:
      properties:
        prompt:
          type: string
          maxLength: 4000
          title: Prompt
          default: ''
      additionalProperties: false
      type: object
      title: GenerateReferenceImageRequest
      description: Draw the reference from an approved prompt. Empty falls back to the stored one.
    GenerateStoryboardRequest:
      properties:
        previousEpisodeId:
          anyOf:
          - type: string
            maxLength: 64
          - type: 'null'
          title: Previousepisodeid
        mergeReferences:
          type: boolean
          title: Mergereferences
          default: true
        regenerate:
          type: boolean
          title: Regenerate
          default: false
        sceneIds:
          anyOf:
          - items:
              type: string
            type: array
            maxItems: 100
            minItems: 1
          - type: 'null'
          title: Sceneids
      additionalProperties: false
      type: object
      title: GenerateStoryboardRequest
      description: 'Render this episode''s shots, anchored to a tone sheet generated first.


        `mergeReferences` trades tokens for fidelity: merged, the cast sheet, the prop sheet and

        the previous episode''s tone sheet arrive as one image; separate, they arrive as several

        and cost more. `previousEpisodeId` carries continuity across an episode boundary.'
    GenerateToneSheetRequest:
      properties:
        previousEpisodeId:
          anyOf:
          - type: string
            maxLength: 64
          - type: 'null'
          title: Previousepisodeid
        mergeReferences:
          type: boolean
          title: Mergereferences
          default: true
        regenerate:
          type: boolean
          title: Regenerate
          default: false
      additionalProperties: false
      type: object
      title: GenerateToneSheetRequest
      description: 'Anchor this episode''s look, as a step of its own.


        Split out of the storyboard run so the user can approve the anchor before paying for a

        full-resolution frame per shot — an episode rendered against a tone sheet nobody looked

        at is an episode that has to be rendered twice.'
    GenerateVideoRequest:
      properties:
        model:
          anyOf:
          - type: string
            maxLength: 160
          - type: 'null'
          title: Model
        episodeId:
          anyOf:
          - type: string
            maxLength: 64
          - type: 'null'
          title: Episodeid
        quality:
          anyOf:
          - type: string
            maxLength: 16
          - type: 'null'
          title: Quality
        aspectRatio:
          anyOf:
          - type: string
            maxLength: 16
          - type: 'null'
          title: Aspectratio
        fps:
          anyOf:
          - type: integer
          - type: 'null'
          title: Fps
        duration:
          anyOf:
          - type: integer
          - type: 'null'
          title: Duration
        promptExtend:
          type: boolean
          title: Promptextend
          default: false
        withAudio:
          type: boolean
          title: Withaudio
          default: false
        sceneIds:
          anyOf:
          - items:
              type: string
            type: array
            maxItems: 100
            minItems: 1
          - type: 'null'
          title: Sceneids
      additionalProperties: false
      type: object
      title: GenerateVideoRequest
    HTTPValidationError:
      properties:
        detail:
          items:
            $ref: '#/components/schemas/ValidationError'
          type: array
          title: Detail
      type: object
      title: HTTPValidationError
    ImportVoiceProfileRequest:
      properties:
        userVoiceId:
          type: string
          maxLength: 64
          minLength: 1
          title: Uservoiceid
        name:
          type: string
          maxLength: 80
          title: Name
          default: ''
        note:
          type: string
          maxLength: 4000
          title: Note
          default: ''
        sampleText:
          type: string
          maxLength: 1000
          title: Sampletext
          default: ''
      additionalProperties: false
      type: object
      required:
      - userVoiceId
      title: ImportVoiceProfileRequest
      description: Bind a timbre already saved on the account to this series.
    OptimizeProjectRequest:
      properties:
        script:
          anyOf:
          - type: string
            maxLength: 200000
          - type: 'null'
          title: Script
        model:
          anyOf:
          - type: string
            maxLength: 160
          - type: 'null'
          title: Model
      additionalProperties: false
      type: object
      title: OptimizeProjectRequest
    OptimizePromptRequest:
      properties:
        kind:
          type: string
          enum:
          - image
          - video
          - voice
          - audio
          - character
          - prop
          - cover
          title: Kind
        prompt:
          type: string
          maxLength: 10000
          minLength: 1
          title: Prompt
        context:
          $ref: '#/components/schemas/PromptOptimizationContext'
      additionalProperties: false
      type: object
      required:
      - kind
      - prompt
      title: OptimizePromptRequest
    ParseProjectRequest:
      properties:
        script:
          type: string
          maxLength: 200000
          minLength: 1
          title: Script
        model:
          anyOf:
          - type: string
            maxLength: 160
          - type: 'null'
          title: Model
        episodeId:
          anyOf:
          - type: string
            maxLength: 64
          - type: 'null'
          title: Episodeid
        replaceAll:
          type: boolean
          title: Replaceall
          default: false
      additionalProperties: false
      type: object
      required:
      - script
      title: ParseProjectRequest
    ProductionSettingsRequest:
      properties:
        mode:
          anyOf:
          - type: string
            enum:
            - comic
            - drama
          - type: 'null'
          title: Mode
        aspectRatio:
          anyOf:
          - type: string
            enum:
            - '9:16'
            - '16:9'
            - '1:1'
          - type: 'null'
          title: Aspectratio
        width:
          anyOf:
          - type: integer
            maximum: 4096.0
            minimum: 256.0
          - type: 'null'
          title: Width
        height:
          anyOf:
          - type: integer
            maximum: 4096.0
            minimum: 256.0
          - type: 'null'
          title: Height
        fps:
          anyOf:
          - type: integer
            enum:
            - 24
            - 30
          - type: 'null'
          title: Fps
        targetDurationMs:
          anyOf:
          - type: integer
            maximum: 600000.0
            minimum: 10000.0
          - type: 'null'
          title: Targetdurationms
        language:
          anyOf:
          - type: string
            maxLength: 20
            minLength: 1
          - type: 'null'
          title: Language
        stylePrompt:
          anyOf:
          - type: string
            maxLength: 4000
          - type: 'null'
          title: Styleprompt
        negativePrompt:
          anyOf:
          - type: string
            maxLength: 4000
          - type: 'null'
          title: Negativeprompt
        currentStage:
          anyOf:
          - type: string
            enum:
            - script
            - bible
            - storyboard
            - audio
            - timeline
            - export
          - type: 'null'
          title: Currentstage
      additionalProperties: false
      type: object
      title: ProductionSettingsRequest
      description: 'Every field optional so a PATCH can carry just the one the user changed.


        Range checks live here for the OpenAPI schema; `project_service.production_settings`

        stays the single place that resolves defaults and cross-field consistency.'
    ProjectModelConfigRequest:
      properties:
        textConfigId:
          anyOf:
          - type: integer
            minimum: 0.0
          - type: 'null'
          title: Textconfigid
        imageConfigId:
          anyOf:
          - type: integer
            minimum: 0.0
          - type: 'null'
          title: Imageconfigid
        videoConfigId:
          anyOf:
          - type: integer
            minimum: 0.0
          - type: 'null'
          title: Videoconfigid
        audioConfigId:
          anyOf:
          - type: integer
            minimum: 0.0
          - type: 'null'
          title: Audioconfigid
        imageResolution:
          anyOf:
          - type: string
            enum:
            - 1K
            - 2K
            - 4K
          - type: 'null'
          title: Imageresolution
        imageRatio:
          anyOf:
          - type: string
            enum:
            - auto
            - '21:9'
            - '16:9'
            - '4:3'
            - '3:2'
            - '1:1'
            - '2:3'
            - '3:4'
            - '9:16'
            - '9:21'
            - adaptive
          - type: 'null'
          title: Imageratio
        videoQuality:
          anyOf:
          - type: string
            enum:
            - 480p
            - 720p
            - 1080p
            - 2K
            - 4K
          - type: 'null'
          title: Videoquality
        videoAspectRatio:
          anyOf:
          - type: string
            enum:
            - auto
            - '21:9'
            - '16:9'
            - '4:3'
            - '3:2'
            - '1:1'
            - '2:3'
            - '3:4'
            - '9:16'
            - '9:21'
            - adaptive
          - type: 'null'
          title: Videoaspectratio
        videoDuration:
          anyOf:
          - type: integer
            maximum: 600.0
            minimum: 1.0
          - type: 'null'
          title: Videoduration
        videoFps:
          anyOf:
          - type: integer
            maximum: 240.0
            minimum: 1.0
          - type: 'null'
          title: Videofps
        videoPromptExtend:
          anyOf:
          - type: boolean
          - type: 'null'
          title: Videopromptextend
      additionalProperties: false
      type: object
      title: ProjectModelConfigRequest
      description: 'Which model this series uses for each kind of work, and the defaults it renders with.


        Every field is optional so a PATCH carries only what changed. A config id of `0` clears

        the pick and returns that purpose to the account default — `null` cannot mean "clear",

        because in a PATCH it already means "leave alone".'
    PromptOptimizationContext:
      properties:
        outputLanguage:
          anyOf:
          - type: string
            enum:
            - auto
            - zh
            - en
          - type: 'null'
          title: Outputlanguage
        aspectRatio:
          anyOf:
          - type: string
            maxLength: 20
          - type: 'null'
          title: Aspectratio
        quality:
          anyOf:
          - type: string
            maxLength: 20
          - type: 'null'
          title: Quality
        duration:
          anyOf:
          - type: integer
            maximum: 600.0
            minimum: 1.0
          - type: 'null'
          title: Duration
        fps:
          anyOf:
          - type: integer
            maximum: 240.0
            minimum: 1.0
          - type: 'null'
          title: Fps
      additionalProperties: false
      type: object
      title: PromptOptimizationContext
    ReorderScenesRequest:
      properties:
        sceneIds:
          items:
            type: string
          type: array
          minItems: 1
          title: Sceneids
        episodeId:
          anyOf:
          - type: string
            maxLength: 64
          - type: 'null'
          title: Episodeid
      additionalProperties: false
      type: object
      required:
      - sceneIds
      title: ReorderScenesRequest
    SetProjectCoverRequest:
      properties:
        imageData:
          type: string
          maxLength: 14000000
          minLength: 1
          title: Imagedata
      additionalProperties: false
      type: object
      required:
      - imageData
      title: SetProjectCoverRequest
      description: A cover to store on the project. `data:image/...;base64,` — the app never takes multipart.
    SetSceneCastRequest:
      properties:
        characterIds:
          items:
            type: string
          type: array
          maxItems: 32
          title: Characterids
      additionalProperties: false
      type: object
      title: SetSceneCastRequest
      description: The full cast of a shot; sending an empty list clears it.
    UpdateCharacterRequest:
      properties:
        name:
          anyOf:
          - type: string
            maxLength: 80
            minLength: 1
          - type: 'null'
          title: Name
        aliases:
          anyOf:
          - type: string
            maxLength: 400
          - type: 'null'
          title: Aliases
