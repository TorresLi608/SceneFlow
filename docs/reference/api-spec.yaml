            minLength: 1
          - type: 'null'
          title: Name
        appearancePrompt:
          anyOf:
          - type: string
            maxLength: 4000
          - type: 'null'
          title: Appearanceprompt
        voiceModel:
          anyOf:
          - type: string
            maxLength: 160
          - type: 'null'
          title: Voicemodel
        fromEpisode:
          anyOf:
          - type: integer
