        seriesBible:
          anyOf:
          - type: string
            maxLength: 200000
          - type: 'null'
          title: Seriesbible
      additionalProperties: false
      type: object
      title: UpdateProjectRequest
    UpdateSceneRequest:
      properties:
        narration:
          anyOf:
          - type: string
            maxLength: 4000
          - type: 'null'
          title: Narration
        dialogue:
          anyOf:
          - type: string
            maxLength: 4000
          - type: 'null'
          title: Dialogue
        speakerCharacterId:
          anyOf:
          - type: string
            maxLength: 64
          - type: 'null'
          title: Speakercharacterid
        visualPrompt:
          anyOf:
