        toEpisode:
          anyOf:
          - type: integer
            minimum: 1.0
          - type: 'null'
          title: Toepisode
      additionalProperties: false
      type: object
      title: UpdateCharacterVariantRequest
    UpdateEpisodeRequest:
      properties:
        title:
          anyOf:
          - type: string
            maxLength: 80
          - type: 'null'
          title: Title
        synopsis:
          anyOf:
          - type: string
            maxLength: 4000
          - type: 'null'
